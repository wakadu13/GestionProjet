name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push sur la branche d'une PR du dépôt déclenche « push » et « pull_request » : les jobs ne tournent que
# pour « push » (voir le « if » du job) ; « pull_request » ne teste que les PR venues d'un fork, que le push
# ne couvre pas. Le groupe contient l'événement : un événement n'annule jamais l'autre (pas de vérifications
# « Cancelled » sur la PR), seulement l'exécution précédente du même événement sur la même branche.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"   # version minimale déclarée dans pyproject.toml
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"   # sortie en cp1252, chemins Windows
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      # Erreurs certaines (nom inconnu, import inutile, syntaxe) : vues en une seconde, même dans une branche
      # rare qu'aucun test n'exécute. Version de ruff figée pour que la CI ne change pas toute seule.
      - name: Vérification du code (ruff)
        if: runner.os == 'Linux'
        run: uvx ruff@0.17.4 check --no-cache --select F,E9 hangar tests

      # Syntaxe des scripts de l'interface (hors bibliothèques tierces) : Node est déjà installé sur
      # les machines de GitHub. tests/test_qcm_v2c.py compare aussi fsrs.js à fsrs.py avec Node.
      - name: Syntaxe du JavaScript
        if: runner.os == 'Linux'
        run: find hangar/static -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check

      - name: Tests unitaires
        run: uv run python -m unittest discover -s tests -v

      # Scripts Windows (démarrage avec la session, mise à jour) : au moins lisibles par PowerShell 5.1.
      - name: Scripts PowerShell (syntaxe)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $erreurs = 0
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err) { $err | ForEach-Object { Write-Host "$($f.Name) : $_" }; $erreurs++ }
          }
          if ($erreurs) { exit 1 }

      # Les commandes affichent des symboles (✓ ✗ →) : elles doivent marcher quand leur sortie est
      # redirigée vers un fichier (encodage cp1252 par défaut sous Windows), sans PYTHONUTF8.
      - name: Commandes avec sortie redirigée
        shell: bash
        run: |
          uv run hangar --data ci-data demo > demo.log
          uv run hangar --data ci-data mail-send > mail.log
          # Mode « boîte d'envoi locale » : l'e-mail de test doit être écrit en .eml (build_mime compris)
          uv run hangar --data ci-data mail-test ci@exemple.fr > mail-test.log
          grep -q "Statut : outbox" mail-test.log
          ls ci-data/outbox/*.eml
          uv run hangar --data ci-data backup > backup.log
          printf 'BEGIN:VCALENDAR\nBEGIN:VEVENT\nUID:1\nDTSTART:20261112T080000\nDTEND:20261112T100000\nSUMMARY:Cours  CM\nEND:VEVENT\nEND:VCALENDAR\n' > planning.ics
          uv run hangar --data ci-data agenda-import planning.ics > import.log
          cat demo.log import.log

      # En cas d'échec : sorties des commandes et boîte d'envoi locale, à télécharger depuis la page du job.
      - name: Journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-${{ matrix.os }}-${{ matrix.python }}
          path: |
            *.log
            ci-data/outbox/
            ci-data/journal/
          if-no-files-found: ignore
