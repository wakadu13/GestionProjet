[project]
name = "hangar"
version = "1.1.0"
description = "Hangar : agenda personnel (emploi du temps .ics, tâches, rappels par e-mail) et gestion de projet, 100 % local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6.3",
    "markdown>=3.6",
    "nh3>=0.2.17",
    "openpyxl>=3.1",
    "waitress>=3.0",
    "python-docx>=1.2.0",
]

[project.scripts]
hangar = "hangar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hangar"]
